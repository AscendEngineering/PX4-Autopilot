# OpenOCD configuration for the rpi-uavfc-r4 probe over SWD.
# Needs an OpenOCD with RP2350 support (0.12.0 or newer, or the Raspberry Pi fork).
#
# Pick the adapter for the bench probe; this is the only board-specific line.
source [find interface/cmsis-dap.cfg]
# source [find interface/jlink.cfg]

adapter speed 5000
transport select swd
source [find target/rp2350.cfg]

# Useful after "halt":
#   mdw 0x20081000 32        status block (spec 1.4)
#   reg pc                   inside the probe's flash region if the ROM accepted the image
